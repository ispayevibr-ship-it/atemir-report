name: Apply report save await fix 8.0.216
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/report-id-save-8.0.216
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply fix
        run: node scripts/apply-report-save-await-fix-8.0.216.js
      - name: Verify syntax
        run: node --check src/report-app.js
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/report-app.js
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "fix: await and verify daily report persistence"
            git push origin HEAD:repair/report-id-save-8.0.216
          fi
