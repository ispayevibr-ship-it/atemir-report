name: Apply banner preview fix 8.0.223

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/banner-preview-8.0.223
          fetch-depth: 0
      - name: Make object photo previews match final banners
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/index.html'); s=p.read_text()
          old='.photoPreview{min-height:170px;background:#edf2f5;border:1px dashed #bdcbd5;border-radius:8px;margin-top:8px;display:grid;place-items:center;overflow:hidden;color:#718491}.photoPreview:has(img){height:auto;min-height:0}.photoPreview img{display:block;width:100%;height:auto;max-height:none;object-fit:contain;background:#eef3f6}'
          new='.photoPreview{background:#edf2f5;border:1px dashed #bdcbd5;border-radius:8px;margin-top:8px;display:grid;place-items:center;overflow:hidden;color:#718491;width:100%;height:auto;aspect-ratio:900/155}.photoPreview img{display:block;width:100%;height:100%;object-fit:cover;object-position:center;background:#eef3f6}.photoPreview#heroPreview510{aspect-ratio:1920/180}'
          if old not in s: raise SystemExit('photo preview CSS anchor not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Verify
        run: |
          grep -F 'aspect-ratio:900/155' src/index.html
          grep -F '.photoPreview#heroPreview510{aspect-ratio:1920/180}' src/index.html
          grep -F 'object-fit:cover' src/index.html
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/index.html
          git diff --cached --quiet && exit 0
          git commit -m "fix: preview object photos at final banner ratios"
          git push origin HEAD:ui/banner-preview-8.0.223
