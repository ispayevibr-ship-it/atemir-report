name: Build Windows EXE
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: |
          node --check main.js
          node --check preload.js
          node --check src/app.js
          node --check src/report-app.js
      - name: Check inline JavaScript in index.html
        shell: pwsh
        run: |
          $html = Get-Content src/index.html -Raw
          $scripts = [regex]::Matches($html, '<script(?:\s[^>]*)?>([\s\S]*?)</script>', 'IgnoreCase')
          if ($scripts.Count -eq 0) { throw "No inline scripts found in src/index.html" }
          $i = 0
          foreach ($script in $scripts) {
            $i++
            $path = Join-Path $env:RUNNER_TEMP ("index-inline-" + $i + ".js")
            Set-Content -Path $path -Value $script.Groups[1].Value -Encoding UTF8
            node --check $path
            if ($LASTEXITCODE -ne 0) { throw "Syntax error in src/index.html inline script #$i" }
          }
      - name: Install dependencies
        run: npm install
      - name: Build Windows installer
        run: npx electron-builder --win nsis --x64 --publish never
      - name: Build lightweight update package
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          New-Item -ItemType Directory -Force -Path hot-publish/src | Out-Null
          Copy-Item src/*.html hot-publish/src/
          Copy-Item src/*.js hot-publish/src/
          Copy-Item src/*.css hot-publish/src/
          $files = Get-ChildItem hot-publish/src -File | ForEach-Object {
            @{ path = "src/" + $_.Name; size = $_.Length }
          }
          $size = ($files | Measure-Object -Property size -Sum).Sum
          @{ version=$version; size=$size; files=$files } | ConvertTo-Json -Depth 5 | Set-Content hot-publish/latest.json -Encoding UTF8
      - name: Read app version
        id: app_version
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Publish public auto-update release
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.UPDATE_REPO_TOKEN }}
        run: |
          $version = "${{ steps.app_version.outputs.version }}"
          $tag = "v$version"
          $repo = "ispayevibr-ship-it/atemir-report-updates"
          gh release view $tag --repo $repo *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --repo $repo --title "А-Темир Строй Отчёт $tag"
            if ($LASTEXITCODE -ne 0) { throw "Could not create release $tag" }
          }
          $files = @()
          $files += Get-ChildItem dist -Filter *.exe | ForEach-Object { $_.FullName }
          $files += Get-ChildItem dist -Filter latest.yml | ForEach-Object { $_.FullName }
          $files += Get-ChildItem dist -Filter *.blockmap | ForEach-Object { $_.FullName }
          if ($files.Count -eq 0) { throw "No update assets found" }
          gh release upload $tag @files --repo $repo --clobber
          if ($LASTEXITCODE -ne 0) { throw "Could not upload release assets for $tag" }
      - name: Publish lightweight update files
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.UPDATE_REPO_TOKEN }}
        run: |
          $version = node -p "require('./package.json').version"
          git clone "https://x-access-token:$env:GH_TOKEN@github.com/ispayevibr-ship-it/atemir-report-updates.git" "$env:RUNNER_TEMP/hot-repo"
          Set-Location "$env:RUNNER_TEMP/hot-repo"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          New-Item -ItemType Directory -Force -Path "hot/$version/src" | Out-Null
          Copy-Item "$env:GITHUB_WORKSPACE/hot-publish/src/*" "hot/$version/src/" -Force
          New-Item -ItemType Directory -Force -Path "hot" | Out-Null
          Copy-Item "$env:GITHUB_WORKSPACE/hot-publish/latest.json" "hot/latest.json" -Force
          # Never allow an older concurrently running build to move latest.json backwards.
          try {
            $remoteLatest = Invoke-RestMethod -Uri ("https://raw.githubusercontent.com/ispayevibr-ship-it/atemir-report-updates/main/hot/latest.json?ts=" + [DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds())
            if ($remoteLatest.version) {
              $remoteParts = @($remoteLatest.version.Split('.') | ForEach-Object { [int]$_ })
              $newParts = @($version.Split('.') | ForEach-Object { [int]$_ })
              while ($remoteParts.Count -lt 3) { $remoteParts += 0 }
              while ($newParts.Count -lt 3) { $newParts += 0 }
              $remoteNewer = $false
              for ($i=0; $i -lt 3; $i++) {
                if ($remoteParts[$i] -gt $newParts[$i]) { $remoteNewer = $true; break }
                if ($remoteParts[$i] -lt $newParts[$i]) { break }
              }
              if ($remoteNewer) {
                Write-Host "Keeping newer hot/latest.json version $($remoteLatest.version); this build is $version"
                Invoke-WebRequest -Uri ("https://raw.githubusercontent.com/ispayevibr-ship-it/atemir-report-updates/main/hot/latest.json?ts=" + [DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds()) -OutFile "hot/latest.json"
              }
            }
          } catch {
            Write-Host "Could not compare remote lightweight manifest; publishing current build manifest."
          }
          git add hot
          git commit -m "Lightweight update $version"
          $pushed = $false
          for ($attempt = 1; $attempt -le 5 -and -not $pushed; $attempt++) {
            git fetch origin main
            git rebase origin/main
            if ($LASTEXITCODE -ne 0) {
              git rebase --abort 2>$null
              git reset --hard origin/main
              New-Item -ItemType Directory -Force -Path "hot/$version/src" | Out-Null
              Copy-Item "$env:GITHUB_WORKSPACE/hot-publish/src/*" "hot/$version/src/" -Force
              $remoteVersion = ""
              try { $remoteVersion = (Get-Content "hot/latest.json" -Raw | ConvertFrom-Json).version } catch {}
              $useNew = $true
              if ($remoteVersion) {
                $rp = @($remoteVersion.Split('.') | ForEach-Object { [int]$_ })
                $np = @($version.Split('.') | ForEach-Object { [int]$_ })
                while ($rp.Count -lt 3) { $rp += 0 }; while ($np.Count -lt 3) { $np += 0 }
                for ($i=0; $i -lt 3; $i++) {
                  if ($rp[$i] -gt $np[$i]) { $useNew = $false; break }
                  if ($rp[$i] -lt $np[$i]) { break }
                }
              }
              if ($useNew) { Copy-Item "$env:GITHUB_WORKSPACE/hot-publish/latest.json" "hot/latest.json" -Force }
              git add hot
              git commit -m "Lightweight update $version"
            }
            git push origin HEAD:main
            if ($LASTEXITCODE -eq 0) { $pushed = $true } else { Start-Sleep -Seconds 2 }
          }
          if (-not $pushed) { throw "Failed to publish lightweight update after retries" }
