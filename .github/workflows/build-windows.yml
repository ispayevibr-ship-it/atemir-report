name: Build Windows EXE
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: atemir-main-publish
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: |
          node --check bootstrap.js
          node --check main.js
          node --check preload.js
          node --check src/app.js
          node --check src/report-app.js
      - name: Reject placeholder/corrupt runtime
        shell: pwsh
        run: |
          $runtime = Get-Content main.js -Raw
          if ($runtime -match '^\s*PLACEHOLDER\s*;?\s*$') { throw "main.js is PLACEHOLDER" }
          if ($runtime.Length -lt 1000) { throw "main.js is unexpectedly small: $($runtime.Length) bytes" }
      - name: Check inline JavaScript in index.html
        shell: pwsh
        run: |
          $html = Get-Content src/index.html -Raw
          $scripts = [regex]::Matches($html, '<script(?:\s[^>]*)?>([\s\S]*?)</script>', 'IgnoreCase')
          if ($scripts.Count -eq 0) { throw "No inline scripts found in src/index.html" }
          $i = 0
          foreach ($script in $scripts) {
            $i++
            $path = Join-Path $env:RUNNER_TEMP ("index-inline-" + $i + ".js")
            Set-Content -Path $path -Value $script.Groups[1].Value -Encoding UTF8
            node --check $path
            if ($LASTEXITCODE -ne 0) { throw "Syntax error in src/index.html inline script #$i" }
          }
      - name: Install dependencies
        run: npm install
      - name: Build Windows installer
        run: npx electron-builder --win nsis --x64 --publish never
      - name: Detect release type
        id: core_change
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          # Compare the new main state against its first parent. This also works for merge commits.
          $changed = @(git diff --name-only HEAD^1 HEAD)
          $core = $false
          foreach ($f in $changed) {
            if ($f -eq "bootstrap.js" -or $f -eq "main.js" -or $f -eq "preload.js" -or $f -eq "package-lock.json" -or $f -like "build/*" -or $f -eq ".github/workflows/build-windows.yml") { $core = $true }
          }
          "core=$($core.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          Write-Host "Changed files: $($changed -join ', ')"
          Write-Host "Full release required: $core"
      - name: Build lightweight update package
        if: github.event_name == 'push' && steps.core_change.outputs.core != 'true'
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          New-Item -ItemType Directory -Force -Path hot-publish/src | Out-Null
          Copy-Item src/*.html hot-publish/src/
          Copy-Item src/*.js hot-publish/src/
          Copy-Item src/*.css hot-publish/src/
          $files = Get-ChildItem hot-publish/src -File | ForEach-Object { @{ path = "src/" + $_.Name; size = $_.Length; sha256 = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant() } }
          $size = ($files | Measure-Object -Property size -Sum).Sum
          @{ version=$version; size=$size; files=$files } | ConvertTo-Json -Depth 5 | Set-Content hot-publish/latest.json -Encoding UTF8
      - name: Read app version
        id: app_version
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Publish public auto-update release
        if: github.event_name == 'push' && steps.core_change.outputs.core == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.UPDATE_REPO_TOKEN }}
        run: |
          $version = "${{ steps.app_version.outputs.version }}"
          $tag = "v$version"
          $repo = "ispayevibr-ship-it/atemir-report-updates"
          gh release view $tag --repo $repo *> $null
          if ($LASTEXITCODE -ne 0) { gh release create $tag --repo $repo --title "А-Темир Строй Отчёт $tag" }
          if ($LASTEXITCODE -ne 0) { throw "Could not create release $tag" }
          $files = @()
          $files += Get-ChildItem dist -Filter *.exe | ForEach-Object { $_.FullName }
          $files += Get-ChildItem dist -Filter latest.yml | ForEach-Object { $_.FullName }
          $files += Get-ChildItem dist -Filter *.blockmap | ForEach-Object { $_.FullName }
          if ($files.Count -lt 3) { throw "Expected EXE, latest.yml and blockmap; got $($files.Count) assets" }
          gh release upload $tag @files --repo $repo --clobber
          if ($LASTEXITCODE -ne 0) { throw "Could not upload release assets for $tag" }
      - name: Publish lightweight update files
        if: github.event_name == 'push' && steps.core_change.outputs.core != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.UPDATE_REPO_TOKEN }}
        run: |
          $version = node -p "require('./package.json').version"
          git clone "https://x-access-token:$env:GH_TOKEN@github.com/ispayevibr-ship-it/atemir-report-updates.git" "$env:RUNNER_TEMP/hot-repo"
          Set-Location "$env:RUNNER_TEMP/hot-repo"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          $latestPath = "hot/latest.json"
          if (Test-Path $latestPath) {
            $current = Get-Content $latestPath -Raw | ConvertFrom-Json
            $incoming = [version]$version
            $published = [version]$current.version
            if ($incoming -lt $published) {
              Write-Host "Skip stale lightweight publish $version; latest is $($current.version)"
              exit 0
            }
          }
          New-Item -ItemType Directory -Force -Path "hot/$version/src" | Out-Null
          Copy-Item "$env:GITHUB_WORKSPACE/hot-publish/src/*" "hot/$version/src/" -Force
          Copy-Item "$env:GITHUB_WORKSPACE/hot-publish/latest.json" "hot/latest.json" -Force
          git add hot
          git commit -m "Lightweight update $version"
          git pull --rebase origin main
          if (Test-Path $latestPath) {
            $afterPull = Get-Content $latestPath -Raw | ConvertFrom-Json
            if ([version]$version -lt [version]$afterPull.version) {
              Write-Host "A newer lightweight update $($afterPull.version) appeared; do not overwrite it with $version"
              exit 0
            }
          }
          git push origin HEAD:main
