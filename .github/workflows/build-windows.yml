name: Build Windows EXE
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: |
          node --check main.js
          node --check preload.js
          node --check src/app.js
      - name: Install dependencies
        run: npm install
      - name: Build Windows installer
        run: npx electron-builder --win nsis --x64 --publish never
      - name: Read app version
        id: app_version
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Publish public auto-update release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          repository: ispayevibr-ship-it/atemir-report-updates
          token: ${{ secrets.UPDATE_REPO_TOKEN }}
          tag_name: v${{ steps.app_version.outputs.version }}
          name: А-Темир Строй Отчёт v${{ steps.app_version.outputs.version }}
          files: |
            dist/*.exe
            dist/latest.yml
            dist/*.blockmap
          fail_on_unmatched_files: true
