name: Apply daily report save fix
on:
  push:
    branches: [fix/daily-report-save]
    paths: ['scripts/fix-daily-report-save.js', '.github/workflows/fix-daily-report-save.yml']
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/daily-report-save
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/fix-daily-report-save.js
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/report-app.js
          git diff --cached --quiet && exit 0
          git commit -m "Fix atomic daily report persistence"
          git push origin HEAD:fix/daily-report-save
