name: Apply legacy object deletion cleanup 8.0.221

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/legacy-object-delete-8.0.221
          fetch-depth: 0
      - name: Patch legacy object cleanup
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/app.js')
          s=p.read_text()
          old='await window.atemirDesktop?.dbDeleteObject?.(oid);localStorage.removeItem("atemir_v9__object_"+oid);'
          new='await window.atemirDesktop?.dbDeleteObject?.(oid);let legacyKey="atemir_v9__object_"+oid;localStorage.removeItem(legacyKey);await window.atemirDesktop?.dbRemove?.(legacyKey);'
          if old not in s:
              raise SystemExit('Expected object delete sequence not found; no changes made')
          s=s.replace(old,new,1)
          p.write_text(s)
          print('patched legacy object KV cleanup')
          PY
      - name: Verify patch
        run: |
          node --check src/app.js
          grep -F 'await window.atemirDesktop?.dbRemove?.(legacyKey)' src/app.js
          grep -F 'let legacyKey="atemir_v9__object_"+oid' src/app.js
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app.js
          git diff --cached --quiet && exit 0
          git commit -m "fix: remove legacy object KV record on deletion"
          git push origin HEAD:repair/legacy-object-delete-8.0.221
