<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>А-Темир Строй — Объект</title>
<link rel="stylesheet" href="object-v8.css">
</head>
<body class="objectV8">
<div class="shell">
  <aside class="appSidebar">
    <div class="sidebarBrand"><div id="companyBrand641"></div></div>
    <button class="sidebarObjects" type="button" onclick="location.href='index.html'"><span>‹</span><b>Все объекты</b></button>
    <nav id="nav"></nav>
    <button class="sidebarTop" type="button" onclick="window.scrollTo({top:0,behavior:'smooth'})" title="Наверх"><span>↑</span><b>Наверх</b></button>
  </aside>
  <main>
    <header>
      <div><h1 id="pageTitle">Обзор</h1><p id="pageSub"></p></div>
      <div>
        <button id="clearReport">Очистить отчёт</button>
        <button id="htmlExport">HTML</button>
        <button id="pdfExport">PDF</button>
        <span id="saveState">Сохранено</span>
      </div>
    </header>
    <section id="view"></section>
  </main>
</div>
<script>
(async()=>{
  const objectId=new URLSearchParams(location.search).get("object")||"default";
  try{
    const key="atemir-company-objects-v1";
    let list=[];
    if(window.atemirDesktop?.dbGet){
      // The editor persists through async IPC. Read asynchronously here so an immediate
      // click into the object cannot resurrect the previous synchronous snapshot.
      let value=await window.atemirDesktop.dbGet(key);
      list=Array.isArray(value)?value:[];
      // One short retry also covers a save that was already queued by the previous page.
      await new Promise(r=>setTimeout(r,120));
      value=await window.atemirDesktop.dbGet(key);
      if(Array.isArray(value))list=value;
    }else{
      list=JSON.parse(localStorage.getItem(key)||"[]");
    }
    const canonical=list.find(x=>String(x?.id)===String(objectId));
    if(canonical&&window.atemirDesktop?.dbSet){
      const baseKey="atemir_entity_"+objectId+"_base";
      const oldBase=window.atemirDesktop.dbGetSync?.(baseKey);
      const nextBase={
        ...(oldBase&&typeof oldBase==="object"?oldBase:{}),
        objectName:canonical.name||"",
        client:canonical.client||"",
        address:canonical.address||"",
        participants:canonical.participants??oldBase?.participants??"",
        notes:canonical.notes??oldBase?.notes??""
      };
      await window.atemirDesktop.dbSet(baseKey,nextBase);
    }
  }catch(e){console.error("Object metadata sync",e)}
  const script=document.createElement("script");
  script.src="report-app.js";
  document.body.appendChild(script);
})();
</script>
</body>
</html>
