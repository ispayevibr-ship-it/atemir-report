<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>А-Темир Строй — Объект</title>
<link rel="stylesheet" href="object-v8.css">
</head>
<body class="objectV8">
<div class="shell">
  <aside class="appSidebar">
    <div class="sidebarBrand"><div id="companyBrand641"></div></div>
    <button class="sidebarObjects" type="button" onclick="location.href='index.html'"><span>‹</span><b>Все объекты</b></button>
    <nav id="nav"></nav>
    <button class="sidebarTop" type="button" onclick="window.scrollTo({top:0,behavior:'smooth'})" title="Наверх"><span>↑</span><b>Наверх</b></button>
  </aside>
  <main>
    <header>
      <div><h1 id="pageTitle">Обзор</h1><p id="pageSub"></p></div>
      <div>
        <button id="clearReport">Очистить отчёт</button>
        <button id="htmlExport">HTML</button>
        <button id="pdfExport">PDF</button>
        <span id="saveState">Сохранено</span>
      </div>
    </header>
    <section id="view"></section>
  </main>
</div>
<script>
(async()=>{
  const objectId=new URLSearchParams(location.search).get("object")||"default";
  try{
    const listKey="atemir-company-objects-v1";
    const detailKey="atemir_v9__object_"+objectId;
    const baseKey="atemir_entity_"+objectId+"_base";
    let list=window.atemirDesktop?.dbGet?await window.atemirDesktop.dbGet(listKey):JSON.parse(localStorage.getItem(listKey)||"[]");
    if(!Array.isArray(list))list=[];
    const canonical=list.find(x=>String(x?.id)===String(objectId));
    let detail=window.atemirDesktop?.dbGet?await window.atemirDesktop.dbGet(detailKey):JSON.parse(localStorage.getItem(detailKey)||"{}");
    if(!detail||typeof detail!=="object")detail={};
    let entityBase=window.atemirDesktop?.dbGet?await window.atemirDesktop.dbGet(baseKey):null;
    if(!entityBase||typeof entityBase!=="object")entityBase={};

    // The object card is the authoritative source for editable object metadata.
    // Mirror it into BOTH stores used by report-app before report-app starts.
    if(canonical){
      const meta={
        objectName:canonical.name||"",
        client:canonical.client||"",
        address:canonical.address||"",
        participants:canonical.participants??detail.base?.participants??entityBase.participants??"",
        notes:canonical.notes??detail.base?.notes??entityBase.notes??""
      };
      detail.base={...(detail.base||{}),...meta,heroPhoto:detail.base?.heroPhoto??entityBase.heroPhoto??""};
      entityBase={...entityBase,...meta,heroPhoto:detail.base.heroPhoto};
      if(window.atemirDesktop?.dbSet){
        await window.atemirDesktop.dbSet(detailKey,detail);
        await window.atemirDesktop.dbSet(baseKey,entityBase);
        // Verify the writes before report-app is allowed to hydrate/save anything.
        const verifyDetail=await window.atemirDesktop.dbGet(detailKey);
        const verifyBase=await window.atemirDesktop.dbGet(baseKey);
        if(verifyDetail?.base?.objectName!==meta.objectName||verifyBase?.objectName!==meta.objectName)throw new Error("Object metadata verification failed");
      }else{
        localStorage.setItem(detailKey,JSON.stringify(detail));
      }
    }
  }catch(e){console.error("Object metadata sync",e)}
  const script=document.createElement("script");
  script.src="report-app.js";
  document.body.appendChild(script);
})();
</script>
</body>
</html>
