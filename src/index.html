function compress(file){return new Promise((ok,no)=>{let im=new Image(),u=URL.createObjectURL(file);im.onload=()=>{let k=Math.min(1,1200/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext("2d").drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);ok(c.toDataURL("image/jpeg",.84))};im.onerror=no;im.src=u})}
function openModal(o){

<script>
(function(){
 function e248(v){return String(v??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
 function n248(v){return Number(String(v??"").replace(",","."))||0}
 function f248(v){return new Intl.NumberFormat("ru-RU",{maximumFractionDigits:2}).format(n248(v))}
 function detail248(o){try{return JSON.parse(localStorage.getItem("atemir_v9__object_"+o.id)||"{}")}catch(e){return {}}}
 function objectTotals248(o){
   const x=detail248(o),reports=Array.isArray(x.workDays)?x.workDays:[],tasks=Array.isArray(x.tasks)?x.tasks:[],num=v=>n248(v),amount=z=>num(z.qty)*(num(z.per)||1);
   const groups={};tasks.forEach(t=>{let k=(t.type||"")+"|||"+(t.code||"")+"|||"+(t.unit||"");if(!groups[k])groups[k]={project:0,done:0};groups[k].project+=num(t.volume)});
   reports.forEach(day=>(day.items||[]).forEach(w=>{let k=(w.type||"")+"|||"+(w.code||"")+"|||"+(w.unit||"");if(!groups[k])groups[k]={project:0,done:0};groups[k].done+=amount(w)}));
   const vals=Object.values(groups),project=vals.reduce((a,g)=>a+g.project,0),done=vals.reduce((a,g)=>a+g.done,0),last=reports.filter(r=>r.date).slice().sort((a,b)=>String(a.date).localeCompare(String(b.date))).at(-1);
   const people=last?(last.workers||[]).reduce((a,z)=>a+num(z.qty),0):0,equipment=last?(last.equipment||[]).reduce((a,z)=>a+num(z.qty),0):0;
   const pctGroups=vals.filter(g=>g.project>0),pct=pctGroups.length?pctGroups.reduce((a,g)=>a+Math.min(100,g.done/g.project*100),0)/pctGroups.length:0;
   return {project,done,left:Math.max(0,project-done),pct,people,equipment,reports:reports.length,last:last?.date||"",detail:x};
 }
 function reportHTML248(){
 const list=objects||[],all=list.map(o=>({o,t:objectTotals248(o)})),active=all.filter(x=>(x.o.status||"В работе")!=="Закончен"),avg=active.length?active.reduce((a,x)=>a+x.t.pct,0)/active.length:0;
 const blocks=all.map(({o,t})=>{let x=t.detail||{},g={};(x.tasks||[]).forEach(q=>{let k=[q.type||"—",q.code||"—",q.unit||""].join("|||");g[k]=g[k]||{type:q.type||"—",code:q.code||"—",unit:q.unit||"",project:0,done:0};g[k].project+=n248(q.volume)});(x.workDays||[]).forEach(d=>(d.items||[]).forEach(w=>{let k=[w.type||"—",w.code||"—",w.unit||""].join("|||");g[k]=g[k]||{type:w.type||"—",code:w.code||"—",unit:w.unit||"",project:0,done:0};g[k].done+=n248(w.qty)*(n248(w.per)||1)}));let rows=Object.values(g).map(v=>"<tr><td>"+e248(v.type)+"</td><td>"+e248(v.code)+"</td><td>"+f248(v.project)+"</td><td>"+f248(v.done)+"</td><td>"+f248(Math.max(0,v.project-v.done))+"</td><td>"+e248(v.unit||"—")+"</td></tr>").join("");return "<section><h2>"+e248(o.name)+"</h2><p>"+e248(o.client||"—")+" · "+e248(o.status||"В работе")+" · готовность "+Math.round(t.pct)+"% · "+f248(t.people)+" чел. · "+f248(t.equipment)+" ед. техники</p><table><tr><th>Вид работ</th><th>Шифр</th><th>Проект</th><th>Выполнено</th><th>Остаток</th><th>Ед.</th></tr>"+(rows||"<tr><td colspan='6'>Нет объёмов</td></tr>")+"</table></section>"}).join("");
 return "<!doctype html><html lang='ru'><head><meta charset='utf-8'><title>Сводный отчёт</title><style>body{font:14px Arial;margin:28px;color:#17202a}h1,h2{color:#082b4b}section{margin:24px 0;break-inside:avoid}table{width:100%;border-collapse:collapse}th,td{border:1px solid #d9e0e6;padding:8px}th{background:#eef3f7}.stats{display:flex;gap:20px;flex-wrap:wrap}.stats b{font-size:20px;color:#082b4b}</style></head><body><h1>ТОО «А-Темир Строй»</h1><p>Сводный отчёт по всем объектам · "+new Date().toLocaleString("ru-RU")+"</p><div class='stats'><span>Объектов <b>"+list.length+"</b></span><span>В работе <b>"+active.length+"</b></span><span>Средняя готовность <b>"+Math.round(avg)+"%</b></span><span>Людей <b>"+all.reduce((a,x)=>a+x.t.people,0)+"</b></span><span>Техники <b>"+all.reduce((a,x)=>a+x.t.equipment,0)+"</b></span></div>"+blocks+"</body></html>";
 }
