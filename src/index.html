<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>А-Темир Строй — Объекты</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef3f7;font-family:Arial,sans-serif;color:#172535}
.top{background:linear-gradient(135deg,#082b4b,#103b64);color:#fff;padding:18px 24px}.top b{font-size:20px}.top small{display:block;margin-top:4px;color:#dbe8f2}
.wrap{max-width:1400px;margin:auto;padding:20px}.hero{background:#fff;border-radius:12px;padding:20px;display:flex;justify-content:space-between;align-items:center;gap:15px}
h1{margin:0 0 5px;color:#103b64;font-size:23px}.muted{color:#6e7e8c;font-size:12px}
.btn{border:0;border-radius:7px;padding:10px 14px;font-weight:700;cursor:pointer}.yellow{background:#f4b41a;color:#172535}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:14px}.card{background:#fff;border:1px solid #d6e0e8;border-radius:11px;padding:16px;cursor:pointer}.card:hover{box-shadow:0 5px 18px #173a5420}.card h3{margin:7px 0;color:#103b64}.badge{display:inline-block;background:#e7f2ea;color:#287442;padding:4px 8px;border-radius:20px;font-size:10px;font-weight:700}
.empty{background:#fff;border:1px dashed #cbd6df;border-radius:10px;padding:30px;text-align:center;color:#6e7e8c;margin-top:14px}
.modal{position:fixed;inset:0;background:#10263888;display:flex;align-items:center;justify-content:center;padding:20px}.box{background:#fff;border-radius:12px;padding:20px;width:min(620px,100%)}label{display:block;font-size:11px;font-weight:700;color:#536777;margin:8px 0 4px}input{width:100%;padding:9px;border:1px solid #cbd6df;border-radius:6px}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.white{background:#fff;border:1px solid #ccd8e1;color:#103b64}
@media(max-width:850px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:600px){.grid{grid-template-columns:1fr}.hero{align-items:flex-start;flex-direction:column}}
</style></head><body>
<div class="top"><b>ТОО «А-Темир Строй»</b><small>Общая страница строительных объектов</small></div>
<div class="wrap"><div class="hero"><div><h1>Объекты</h1><div class="muted">Откройте объект для ведения накопительного отчёта.</div></div><button class="btn yellow" id="add">+ Новый объект</button></div><div id="list"></div></div>
<script>
const KEY="atemir-company-objects-v1";let objects=[];try{objects=JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){}
function save(){localStorage.setItem(KEY,JSON.stringify(objects))}
function render(){let el=document.getElementById("list");if(!objects.length){el.innerHTML='<div class="empty">Объектов пока нет. Создайте первый объект.</div>';return}el.innerHTML='<div class="grid">'+objects.map(o=>'<div class="card" data-id="'+o.id+'"><span class="badge">В работе</span><h3>'+esc(o.name)+'</h3><div class="muted">'+esc(o.client||"Заказчик не указан")+'</div><div class="muted" style="margin-top:6px">'+esc(o.address||"")+'</div></div>').join("")+'</div>';document.querySelectorAll("[data-id]").forEach(x=>x.onclick=()=>location.href="object.html?object="+encodeURIComponent(x.dataset.id))}
function esc(s){return String(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
document.getElementById("add").onclick=()=>{document.body.insertAdjacentHTML("beforeend",'<div class="modal" id="modal"><div class="box"><h2>Новый объект</h2><label>Название объекта</label><input id="name"><label>Заказчик</label><input id="client"><label>Адрес</label><input id="address"><div class="actions"><button class="btn white" id="cancel">Отмена</button><button class="btn yellow" id="create">Создать объект</button></div></div></div>');document.getElementById("cancel").onclick=()=>document.getElementById("modal").remove();document.getElementById("create").onclick=()=>{let name=document.getElementById("name").value.trim();if(!name)return alert("Укажите название объекта.");let o={id:Date.now(),name,client:document.getElementById("client").value,address:document.getElementById("address").value};objects.push(o);save();location.href="object.html?object="+o.id}}
render();
</script></body></html>
