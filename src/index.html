<script>
(function(){
 const key="atemir-company-profile-v1",modal=document.getElementById("companyProfile559"),btn=document.getElementById("companyInfo559");
 const val=id=>document.getElementById(id),close=()=>modal.classList.remove("on");let removeLogo=false;
 function read(){try{return JSON.parse(localStorage.getItem(key)||"{}")}catch(e){return {}}}
 function open(){const p=read(),set=(id,v)=>{const e=val(id);if(e)e.value=v||""};set("companyName591",p.name);set("companyDirector591",p.director);set("companyBin591",p.bin);set("companyAddress591",p.address);set("companyPhone591",p.phone);set("companyEmail591",p.email);const lp=val("companyLogoPreview591"),del=val("companyLogoDelete591");removeLogo=false;pendingLogo="";val("companyLogo591").value="";if(lp)lp.innerHTML=p.logo?'<img src="'+p.logo+'" style="max-width:180px;max-height:90px;object-fit:contain">' : '<span class="muted">Логотип не загружен</span>';if(del)del.style.display=p.logo?"":"none";modal.classList.add("on")}
 btn.onclick=open;const updateBtn=val("checkUpdates729");if(updateBtn)updateBtn.onclick=async()=>{updateBtn.disabled=true;updateBtn.textContent="↻ Проверяем…";try{if(!window.atemirDesktop?.checkUpdates){alert("Проверка обновлений недоступна в этой версии программы.");return}let r=await window.atemirDesktop.checkUpdates();if(r?.state==="none")alert("Обновлений нет.\nУстановлено: "+(r.installed||"—")+"\nПоследняя версия: "+(r.latest||r.installed||"—"));else if(r?.state==="available")alert("Доступно обновление.\nУстановлено: "+(r.installed||"—")+"\nПоследняя версия: "+(r.latest||"—")+"\n\nОкно обновления открыто справа внизу.");else if(r?.state==="error")alert("Не удалось проверить обновления.\n"+(r.message||"Попробуйте ещё раз."));else alert("Проверка обновлений завершена.")}catch(e){alert("Не удалось проверить обновления.\n"+(e?.message||e))}finally{updateBtn.disabled=false;updateBtn.textContent="↻ Проверить обновления"}};let pendingLogo="";val("companyLogo591").onchange=e=>{let f=e.target.files&&e.target.files[0];if(!f)return;let rd=new FileReader();rd.onload=()=>{pendingLogo=rd.result;removeLogo=false;val("companyLogoPreview591").innerHTML='<img src="'+pendingLogo+'" style="max-width:180px;max-height:90px;object-fit:contain">';val("companyLogoDelete591").style.display=""};rd.readAsDataURL(f)};val("companyLogoDelete591").onclick=()=>{pendingLogo="";removeLogo=true;val("companyLogo591").value="";val("companyLogoPreview591").innerHTML='<span class="muted">Логотип будет удалён после сохранения</span>';val("companyLogoDelete591").style.display="none"};val("companyProfileClose559").onclick=close;modal.onclick=e=>{if(e.target===modal)close()};
 val("companyProfileSave591").onclick=()=>{const g=id=>val(id).value.trim();localStorage.setItem(key,JSON.stringify({name:g("companyName591"),director:g("companyDirector591"),bin:g("companyBin591"),address:g("companyAddress591"),phone:g("companyPhone591"),email:g("companyEmail591"),logo:removeLogo?"":(pendingLogo||read().logo||"")}));pendingLogo="";removeLogo=false;close()};
})();
