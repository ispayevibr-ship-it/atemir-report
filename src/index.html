<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>А-Темир Строй — Объекты</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef3f7;font-family:Arial,sans-serif;color:#172535}.top{background:linear-gradient(135deg,#082b4b,#103b64);color:#fff;padding:18px 24px}.top b{font-size:20px}.top small{display:block;margin-top:4px;color:#dbe8f2}.wrap{max-width:1400px;margin:auto;padding:20px}.hero{background:#fff;border-radius:12px;padding:20px;display:flex;justify-content:space-between;align-items:center;gap:15px}h1{margin:0 0 5px;color:#103b64;font-size:23px}.muted{color:#6e7e8c;font-size:12px}.btn{border:0;border-radius:7px;padding:10px 14px;font-weight:700;cursor:pointer}.yellow{background:#f4b41a;color:#172535}.white{background:#fff;border:1px solid #ccd8e1;color:#103b64}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:14px}.card{background:#fff;border:1px solid #d6e0e8;border-radius:12px;overflow:hidden;cursor:pointer;transition:.15s}.card:hover{box-shadow:0 6px 20px #173a5425;transform:translateY(-1px)}.cover{height:160px;background:linear-gradient(135deg,#dfe8ee,#c7d5df);display:grid;place-items:center;color:#78909f;font-weight:800;overflow:hidden}.cover img{width:100%;height:100%;object-fit:cover}.body{padding:15px}.card h3{margin:9px 0 6px;color:#103b64}.cardTop{display:flex;align-items:center;justify-content:space-between;gap:8px}.cardActions{display:flex;gap:6px}.mini{border:0;background:#edf3f6;color:#234b64;border-radius:6px;padding:6px 9px;cursor:pointer;font-weight:700}.delObj{background:#f8e7e7;color:#9b3030}.badge{display:inline-block;padding:5px 9px;border-radius:20px;font-size:10px;font-weight:800}.work{background:#e7f2ea;color:#287442}.done{background:#e9edf0;color:#60717d}.empty{background:#fff;border:1px dashed #cbd6df;border-radius:10px;padding:30px;text-align:center;color:#6e7e8c;margin-top:14px}.modal{position:fixed;inset:0;background:#10263888;display:flex;align-items:center;justify-content:center;padding:20px;z-index:20}.box{background:#fff;border-radius:12px;padding:20px;width:min(620px,100%)}label{display:block;font-size:11px;font-weight:700;color:#536777;margin:10px 0 4px}input,select{width:100%;padding:9px;border:1px solid #cbd6df;border-radius:6px}.photoPreview{height:170px;background:#edf2f5;border:1px dashed #bdcbd5;border-radius:8px;margin-top:8px;display:grid;place-items:center;overflow:hidden;color:#718491}.photoPreview img{width:100%;height:100%;object-fit:cover}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
@media(max-width:850px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:600px){.grid{grid-template-columns:1fr}.hero{align-items:flex-start;flex-direction:column}}
</style></head><body>
<div class="top"><b>ТОО «А-Темир Строй»</b><small>Строительные объекты компании</small></div>
<div class="wrap"><div class="hero"><div><h1>Объекты</h1><div class="muted">Выберите объект для просмотра сводки и ведения ежедневных отчётов.</div></div><button class="btn yellow" id="add">+ Новый объект</button></div><div id="list"></div></div>
<script>
const KEY="atemir-company-objects-v1";let objects=[];try{objects=JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){}
const esc=s=>String(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));function save(){localStorage.setItem(KEY,JSON.stringify(objects))}
function render(){let el=document.getElementById("list");if(!objects.length){el.innerHTML='<div class="empty">Объектов пока нет. Создайте первый объект.</div>';return}el.innerHTML='<div class="grid">'+objects.map(o=>'<div class="card" data-id="'+o.id+'"><div class="cover">'+(o.photo?'<img src="'+o.photo+'" alt="">':'Фото объекта')+'</div><div class="body"><div class="cardTop"><span class="badge '+(o.status==="Закончен"?"done":"work")+'">'+esc(o.status||"В работе")+'</span><div class="cardActions"><button class="mini" data-edit="'+o.id+'">Изменить</button><button class="mini delObj" data-delete="'+o.id+'">Удалить</button></div></div><h3>'+esc(o.name)+'</h3><div class="muted">Заказчик: '+esc(o.client||"не указан")+'</div></div></div>').join("")+'</div>';document.querySelectorAll("[data-id]").forEach(x=>x.onclick=e=>{if(e.target.closest("button"))return;location.href="object.html?object="+encodeURIComponent(x.dataset.id)});document.querySelectorAll("[data-edit]").forEach(b=>b.onclick=e=>{e.stopPropagation();openModal(objects.find(x=>String(x.id)===String(b.dataset.edit)))});document.querySelectorAll("[data-delete]").forEach(b=>b.onclick=e=>{e.stopPropagation();let o=objects.find(x=>String(x.id)===String(b.dataset.delete));if(!o||!confirm("Удалить объект «"+o.name+"»? Все данные этого объекта будут удалены."))return;localStorage.removeItem("atemir_v9__object_"+o.id);localStorage.removeItem("atemir_scheme155__object_"+o.id);objects=objects.filter(x=>String(x.id)!==String(o.id));save();render()})}
function compress(file){return new Promise((ok,no)=>{let im=new Image(),u=URL.createObjectURL(file);im.onload=()=>{let k=Math.min(1,1200/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext("2d").drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);ok(c.toDataURL("image/jpeg",.84))};im.onerror=no;im.src=u})}
function openModal(o){let edit=!!o,tempPhoto=o?.photo||"";document.body.insertAdjacentHTML("beforeend",'<div class="modal" id="modal"><div class="box"><h2>'+(edit?'Редактирование объекта':'Новый объект')+'</h2><label>Название объекта</label><input id="name" value="'+esc(o?.name||"")+'"><label>Заказчик</label><input id="client" value="'+esc(o?.client||"")+'"><label>Статус</label><select id="status"><option>В работе</option><option '+(o?.status==="Закончен"?"selected":"")+'>Закончен</option></select><label>Фото объекта</label><input id="photo" type="file" accept="image/*"><div class="photoPreview" id="preview">'+(tempPhoto?'<img src="'+tempPhoto+'">':'1 фото для обложки объекта')+'</div><div class="actions"><button class="btn white" id="cancel">Отмена</button><button class="btn yellow" id="saveObj">'+(edit?'Сохранить':'Создать объект')+'</button></div></div></div>');document.getElementById("cancel").onclick=()=>modal.remove();document.getElementById("photo").onchange=async e=>{let f=e.target.files[0];if(!f)return;tempPhoto=await compress(f);preview.innerHTML='<img src="'+tempPhoto+'">'};document.getElementById("saveObj").onclick=()=>{let name=document.getElementById("name").value.trim();if(!name)return alert("Укажите название объекта.");if(edit){o.name=name;o.client=client.value.trim();o.status=status.value;o.photo=tempPhoto}else objects.push({id:Date.now(),name,client:client.value.trim(),status:status.value,photo:tempPhoto});save();modal.remove();render()}}
document.getElementById("add").onclick=()=>openModal(null);render();
</script></body></html>
